<form [formRoot]="signUpForm">
  @for (fieldConfig of signUpFields; track fieldConfig.name) {
    @let fieldName = fieldConfig.name;
    @let field = signUpForm[fieldName];
    @let fieldInvalid = field().touched() && field().invalid();
    @let errorId = fieldName + '-error';

    <label [for]="fieldName">{{ fieldConfig.label }}</label>
    <input
      [formField]="signUpForm[fieldName]"
      [id]="fieldName"
      [type]="fieldConfig.type"
      [autocomplete]="fieldConfig.autocomplete"
      [aria-invalid]="fieldInvalid"
      [aria-describedby]="fieldInvalid ? errorId : null"
    />

    @if (fieldInvalid) {
      <p [id]="errorId">{{ field().errors()[0]?.message }}</p>
    }
  }
</form>
